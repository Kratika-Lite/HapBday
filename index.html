.msg{min-height:48px;font-size:15px;margin-top:6px}.cake{font-size:80px}.flames{font-size:28px;letter-spacing:6px;min-height:38px}

.conf{position:fixed;top:-20px;font-size:22px;pointer-events:none;z-index:20;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.fl{animation:fl 1s infinite alternate;transform-origin:50% 100%}@keyframes fl{to{transform:scale(1.2) rotate(5deg)}}

{n:'LEVEL 02',t:'Cake & Wish',ic:'🧊',d:'Mombatti bujao aur dil se wish maango.',b:'MAKE A WISH',c:'#3fa9ff',e:'🏮'},

{n:'FINAL LEVEL',t:"Let's Celebrate",ic:'✈️',d:'Ek chhoti si chitthi, dil se.',b:'READ LETTER',c:'#fff3a0'}];

function scratch(k){pb.innerHTML=`<h2 class="F">Scratch Card</h2><p style="color:#9fb4e8">Card ko ragdo, andar surprise hai 🪄</p><div style="position:relative;width:280px;height:140px;margin:auto"><div style="position:absolute;inset:0;display:grid;place-items:center;background:#2a1030;border-radius:12px;font-size:19px;padding:10px">🎁 Mumma, aaj ka dinner aapki pasand ka!</div><canvas id="sc2" width="280" height="140" style="position:absolute;inset:0;border-radius:12px;touch-action:none"></canvas></div>`;const c=sc2.getContext('2d');c.fillStyle='#aaa';c.fillRect(0,0,280,140);c.fillStyle='#666';c.font='20px sans-serif';c.fillText('SCRATCH HERE',70,76);c.globalCompositeOperation='destination-out';let dn=0;const f=e=>{const r=sc2.getBoundingClientRect(),x=(e.clientX-r.left)*280/r.width,y=(e.clientY-r.top)*140/r.height;c.beginPath();c.arc(x,y,18,0,6.3);c.fill();if(!dn){const d=c.getImageData(0,0,280,140).data;let n=0;for(let i=3;i<d.length;i+=40)if(d[i]==0)n++;if(n>d.length/40*.5){dn=1;win(k)}}};sc2.onpointermove=e=>{if(e.buttons||e.pressure)f(e)};sc2.onpointerdown=f}
function simon(k){const C=['🔴','🟡','🟢','🔵'];let seq=[],pos=0,busy=1;pb.innerHTML=`<h2 class="F">Simon Says</h2><p style="color:#9fb4e8" id="sm">Pattern yaad rakho aur dohrao (4 round)</p><div class="gifts" style="grid-template-columns:repeat(2,1fr)">${C.map((c,i)=>`<button class="gift" id="s${i}" style="font-size:44px" onclick="sp3(${i})">${c}</button>`).join('')}</div>`;const fl=i=>new Promise(r=>{const b=document.getElementById('s'+i);b.style.filter='brightness(2.2)';beep();setTimeout(()=>{b.style.filter='';setTimeout(r,250)},400)});async function play(){busy=1;sm.textContent='Dekho...';seq.push(Math.random()*4|0);for(const i of seq)await fl(i);pos=0;busy=0;sm.textContent='Ab tumhari baari!'}window.sp3=async i=>{if(busy)return;busy=1;await fl(i);if(i!=seq[pos]){sm.textContent='Galat! Phir se 🔁';seq=[];setTimeout(play,900);return}if(++pos==seq.length){if(seq.length==4){sm.textContent='Wah! Memory kamaal hai 🎉';win(k)}else setTimeout(play,700)}else busy=0};play()}

pb.innerHTML=`<h2 class="F">Final Level · Let's Celebrate</h2><div class="letter" id="lt"></div>`;let i=0;const v=setInterval(()=>{lt.textContent=t.slice(0,++i);if(i>=t.length){clearInterval(v);confetti();pb.insertAdjacentHTML('beforeend','<p>Dil ki baat likho 💙</p><textarea id="dk" rows="3" style="width:100%;border-radius:10px;padding:8px"></textarea><br><button class="btn" onclick="sv(this)">SAVE</button>')}},35)}
